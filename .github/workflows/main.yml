name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: make format-check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    env:
      GTEST_COLOR: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Test
        if: runner.os != 'Windows'
        run: make test

      - name: Test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          output=$(make test 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ (error|Error|FAILED|failed|fatal|C[0-9]{4}|LNK[0-9]{4}) ]]; then
                printf '::error::%s\n' "$line"
              fi
            done <<< "$output"
          fi
          exit "$status"
